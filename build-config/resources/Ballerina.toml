[package]
distribution = "2201.12.0"
org = "ballerinax"
name = "ai.google.drive"
version = "@toml.version@"
license = ["Apache-2.0"]
icon = "icon.png"
authors = ["Ballerina"]
keywords = ["Vendor/Google", "Area/AI & Machine Learning", "Type/Data Loader", "google", "drive", "documents"]
repository = "https://github.com/ballerina-platform/module-ballerinax-ai.google.drive"

[platform.java21]
# This template is the source of truth: `updateTomlFiles` regenerates ballerina/Ballerina.toml
# from it on every build, so editing only the generated file changes nothing that survives.
#
# `false` is contagious — Ballerina checks compatibility across the whole dependency graph, so
# it would mark every downstream package that merely depends on this loader as incompatible,
# whether or not that package ever extracts an Office file. That cost is real and falls on
# every consumer; the risk below falls only on someone building a native image.
#
# OUTSTANDING: the native-image metadata for the text-extraction stack has not been generated
# or verified. Only `-H:+AddAllCharsets` is declared (see native-image.properties). Apache POI
# and XMLBeans are reflection- and resource-driven — poi-ooxml-lite resolves schema types
# reflectively, XMLBeans loads `.xsb` resources from the jar by name, PDFBox loads font and
# glyphlist resources — and none of that is reachable by native-image's static analysis without
# reflect-config.json / resource-config.json. A native image would still *compile*; Office
# extraction could then fail at runtime with ClassNotFoundException or SchemaTypeLoaderException.
#
# The usual Tika blocker is already designed around: the extractor selects PDFParser/OOXMLParser/
# OfficeParser explicitly rather than via AutoDetectParser, and embedded-document extraction is
# disabled — so much of the stack may already work. To confirm and close this out:
#   1. Run the test suite on a GraalVM JDK with the tracing agent attached, e.g.
#      JAVA_TOOL_OPTIONS="-agentlib:native-image-agent=config-output-dir=<dir>" bal test
#      (the suite already extracts real pdf/docx/xlsx/pptx/doc/xls/ppt fixtures, which is the
#      coverage the agent needs)
#   2. Commit the generated configs under
#      native/src/main/resources/META-INF/native-image/io.ballerina.lib/ai.google.drive-native/
#   3. Verify with `bal build --graalvm` that Office AND PDF extraction both still work.
# Generated metadata is the only kind worth committing — hand-written guesses at POI's
# reflective surface would be no more trustworthy than declaring compatibility untested.
graalvmCompatible = true

# Native text extractor (Apache Tika) for this package.
[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "ai.google.drive-native"
version = "@toml.version@"
path = "../native/build/libs/ai.google.drive-native-@project.version@.jar"

# Apache Tika core + PDF parser module (PDFBox) + Microsoft Office parser module (POI).
# The extractor selects the parser explicitly per uploaded file (see `TextExtractor` /
# `classify`); Google Workspace natives are exported to text, not routed through Tika.
[[platform.java21.dependency]]
groupId = "org.apache.tika"
artifactId = "tika-core"
version = "@tikaVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.tika"
artifactId = "tika-parser-pdf-module"
version = "@tikaVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.tika"
artifactId = "tika-parser-microsoft-module"
version = "@tikaVersion@"

# Tika ZIP/container detection — required so OOXML (.docx/.pptx/.xlsx) files are detected.
[[platform.java21.dependency]]
groupId = "org.apache.tika"
artifactId = "tika-parser-zip-commons"
version = "@tikaVersion@"

# Apache PDFBox (PDF parsing, used by the Tika PDF module).
[[platform.java21.dependency]]
groupId = "org.apache.pdfbox"
artifactId = "pdfbox"
version = "@pdfboxVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.pdfbox"
artifactId = "pdfbox-io"
version = "@pdfboxIoVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.pdfbox"
artifactId = "fontbox"
version = "@pdfboxVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.pdfbox"
artifactId = "jempbox"
version = "@jempboxVersion@"

# Commons IO, required by Tika/PDFBox.
[[platform.java21.dependency]]
groupId = "commons-io"
artifactId = "commons-io"
version = "@commonsIoVersion@"

# Apache POI (Microsoft Office parsing, used by the Tika microsoft module) and its
# runtime dependencies. Versions match those bundled by the ballerina/ai module.
[[platform.java21.dependency]]
groupId = "org.apache.poi"
artifactId = "poi"
version = "@poiVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.poi"
artifactId = "poi-ooxml"
version = "@poiVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.poi"
artifactId = "poi-ooxml-lite"
version = "@poiVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.poi"
artifactId = "poi-scratchpad"
version = "@poiVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.xmlbeans"
artifactId = "xmlbeans"
version = "@xmlbeansVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.commons"
artifactId = "commons-collections4"
version = "@commonsCollections4Version@"

[[platform.java21.dependency]]
groupId = "org.apache.commons"
artifactId = "commons-compress"
version = "@commonsCompressVersion@"

[[platform.java21.dependency]]
groupId = "com.zaxxer"
artifactId = "SparseBitSet"
version = "@sparseBitSetVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.logging.log4j"
artifactId = "log4j-api"
version = "@log4jVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.logging.log4j"
artifactId = "log4j-core"
version = "@log4jVersion@"

# POI's optional-but-reachable dependencies. Without these an encrypted or digitally signed
# OOXML file (commons-codec, for the HMAC/digest work) or a document containing charts or
# geometry (curvesapi, commons-math3) raises NoClassDefFoundError inside Tika.
[[platform.java21.dependency]]
groupId = "commons-codec"
artifactId = "commons-codec"
version = "@commonsCodecVersion@"

[[platform.java21.dependency]]
groupId = "com.github.virtuald"
artifactId = "curvesapi"
version = "@curvesapiVersion@"

[[platform.java21.dependency]]
groupId = "org.apache.commons"
artifactId = "commons-math3"
version = "@commonsMath3Version@"
