org.gradle.caching=true
group=io.ballerina.lib
version=1.0.0-SNAPSHOT
ballerinaLangVersion=2201.12.0

downloadPluginVersion=5.4.0
releasePluginVersion=2.8.0
ballerinaGradlePluginVersion=3.0.0
checkstylePluginVersion=10.12.0

# Native text-extraction stack (Apache Tika + PDFBox + POI), consumed by the
# ballerina/ build.gradle `updateTomlFiles` task and the native/ build.gradle.
tikaVersion=3.2.2
pdfboxVersion=3.0.5
pdfboxIoVersion=3.0.5
jempboxVersion=1.8.17
commonsIoVersion=2.20.0

# Apache POI stack (Microsoft Office text extraction via tika-parser-microsoft-module).
# Versions match those bundled by the ballerina/ai module for Tika 3.2.2.
poiVersion=5.4.1
xmlbeansVersion=5.3.0
commonsCollections4Version=4.4
commonsCompressVersion=1.28.0
sparseBitSetVersion=1.3
log4jVersion=2.25.4

# POI's optional-but-reachable dependencies: encrypted/signed OOXML needs commons-codec,
# and chart/geometry classes need curvesapi and commons-math3. Versions are the ones POI
# 5.4.1 declares.
commonsCodecVersion=1.18.0
curvesapiVersion=1.08
commonsMath3Version=3.6.1
