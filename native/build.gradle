plugins {
    id 'java'
    id 'checkstyle'
}

description = 'Google Drive document data loader - Java native utils'

dependencies {
    // Provided by the Ballerina runtime at execution time.
    implementation group: 'org.ballerinalang', name: 'ballerina-runtime', version: "${ballerinaLangVersion}"

    // Apache Tika: text extraction for uploaded PDF and Microsoft Office documents.
    // Compiled against here; the same jars (plus the POI runtime stack) are declared as
    // platform dependencies in Ballerina.toml. The extractor selects the parser explicitly
    // (PDFBox for PDF, POI for Office); Google Workspace natives are exported, not routed here.
    implementation group: 'org.apache.tika', name: 'tika-core', version: "${tikaVersion}"
    implementation group: 'org.apache.tika', name: 'tika-parser-pdf-module', version: "${tikaVersion}"
    implementation group: 'org.apache.tika', name: 'tika-parser-microsoft-module', version: "${tikaVersion}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// The WSO2 checkstyle rules are downloaded by the `:checkstyle` project rather than committed,
// so they do not exist until `:checkstyle:downloadCheckstyleRuleFiles` has run — which the task
// dependency below guarantees before any Checkstyle task reads these paths.
checkstyle {
    toolVersion = "${project.checkstylePluginVersion}"
    configFile = rootProject.file("build-config/checkstyle/build/checkstyle.xml")
    configProperties = [
            'suppressionFile': rootProject.file("build-config/checkstyle/build/suppressions.xml")
    ]
}

// Only the production sources are linted; the WSO2 ruleset is written for them.
checkstyleTest.enabled = false

tasks.withType(Checkstyle).configureEach {
    dependsOn(':checkstyle:downloadCheckstyleRuleFiles')
}
