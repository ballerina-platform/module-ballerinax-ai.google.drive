# AddAllCharsets is required, not optional: TextDecoder resolves the charset a Drive download
# declares via Charset.forName(...), which can be any name the JVM knows. A native image ships
# only a small default charset set, so without this a UTF-16 or windows-1252 file would fail to
# decode rather than being read correctly.
#
# NOTE: `graalvmCompatible` is currently `false` in Ballerina.toml, so this file is not yet
# exercised. It is kept because the flag is still needed once the reflect/resource metadata for
# the POI/XMLBeans/Tika stack is generated. See the comment in Ballerina.toml.
Args = -H:+AddAllCharsets
